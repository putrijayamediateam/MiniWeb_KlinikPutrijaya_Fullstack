<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klinik Putrijaya — Website Update</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;

      display: grid;
      place-items: center;

      font-family:
        Inter,
        Arial,
        sans-serif;

      color: #34242c;
      background:
        linear-gradient(
          145deg,
          #ffd6e9,
          #fff8fb 58%,
          #ffadd4
        );
    }

    .maintenance-card {
      width: min(520px, 100%);
      padding: 38px;

      text-align: center;

      border: 1px solid rgba(147, 20, 81, 0.14);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.96);

      box-shadow:
        0 24px 70px
        rgba(74, 31, 52, 0.15);
    }

    img {
      width: 180px;
      max-width: 100%;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.8rem;
    }

    p {
      margin: 0;
      color: #745b68;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      margin-top: 24px;
      padding: 12px 20px;

      border-radius: 999px;

      color: #fff;
      background: #e00d92;

      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="maintenance-card">
    <img
      src="images/logoklinik.png"
      alt="Klinik Putrijaya"
    >

    <h1>Website sedang dikemas kini</h1>

    <p>
      Kami sedang menambah dan menyusun semula maklumat
      perkhidmatan Klinik Putrijaya. Website akan kembali
      tidak lama lagi.
    </p>

    <a href="https://wa.me/">
      Hubungi kami melalui WhatsApp
    </a>
  </main>
</body>
</html>
