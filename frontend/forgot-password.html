<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Klinik Putrijaya Admin</title>
  <link rel="stylesheet" href="css/admin-auth.css">
  <script src="js/api.js" defer></script>
  <script src="js/forgot-password.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">
        <img src="images/logoklinik.png" alt="Klinik Putrijaya">
      </a>
      <p class="auth-kicker">Admin security</p>
      <h1>Forgot password</h1>
      <p class="auth-intro">Enter the email registered to your admin account.</p>

      <form id="forgotPasswordForm">
        <label for="resetEmail">Admin email</label>
        <input id="resetEmail" name="email" type="email" autocomplete="email" required>
        <button id="forgotPasswordBtn" type="submit">Send reset link</button>
        <div id="forgotPasswordMessage" class="auth-message" aria-live="polite"></div>
      </form>

      <a class="auth-back" href="admin.html">← Back to admin login</a>
    </section>
  </main>
</body>
</html>
