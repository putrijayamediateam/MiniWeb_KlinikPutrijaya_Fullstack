<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Forgot Password | Klinik Putrijaya Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/admin-auth.css?v=20261118-1">
  <script src="js/api.js" defer></script>
  <script src="js/forgot-password.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <img src="images/cheras-front-6.webp" alt="" class="auth-hero-photo" width="1200" height="900">
      <a class="auth-hero-brand" href="index.html" aria-label="Klinik Putrijaya website">
        <img src="images/logoklinik.png" alt="Klinik Putrijaya">
      </a>
      <div class="auth-hero-copy">
        <p class="auth-hero-title">Staff portal</p>
        <p>Bookings, services, promotions and community updates for Cheras, Sungai Besi and Puchong.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-inner">
        <a class="auth-brand" href="index.html">
          <img src="images/logoklinik.png" alt="Klinik Putrijaya">
        </a>
        <p class="auth-kicker">Admin security</p>
        <h1>Forgot password</h1>
        <p class="auth-intro">Enter the email registered to your admin account.</p>

        <form id="forgotPasswordForm">
          <label for="resetEmail">Admin email</label>
          <input id="resetEmail" name="email" type="email" autocomplete="email" required>
          <button id="forgotPasswordBtn" type="submit">Send reset link</button>
          <div id="forgotPasswordMessage" class="auth-message" aria-live="polite"></div>
        </form>

        <a class="auth-back" href="admin.html">← Back to admin login</a>
      </div>
    </section>
  </main>
</body>
</html>
