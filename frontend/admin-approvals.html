<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Admin Approvals | Klinik Putrijaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/admin-approvals.css?v=20261118-1">
</head>
<body>
  <header class="approval-topbar">
    <a href="admin.html" class="approval-logo" aria-label="Back to staff dashboard">
      <img src="images/logoklinik.png" alt="Klinik Putrijaya">
    </a>
    <div class="header-actions">
      <a href="admin.html" class="secondary-button">Back to dashboard</a>
      <button id="refreshBtn" type="button" class="primary-button">Refresh</button>
    </div>
  </header>

  <main class="approval-shell">
    <div class="approval-header">
      <h1>Admin account approvals</h1>
      <p>Only the active superadmin may approve or reject new management accounts.</p>
    </div>

    <section id="accessCard" class="status-card">Checking superadmin access…</section>

    <section id="approvalPanel" class="approval-panel" hidden>
      <div class="panel-heading">
        <div>
          <h2>Pending approval</h2>
          <p id="pendingSummary">Loading accounts…</p>
        </div>
      </div>

      <div id="approvalMessage" class="message" aria-live="polite"></div>
      <div id="pendingAccounts" class="account-list"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-approvals.js"></script>
</body>
</html>
