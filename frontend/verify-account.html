<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Account | Klinik Putrijaya Admin</title>
  <link rel="stylesheet" href="css/admin-auth.css">
  <link rel="stylesheet" href="css/signup.css">
  <script src="js/verify-account.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">
        <img src="images/logoklinik.png" alt="Klinik Putrijaya">
      </a>

      <p class="auth-kicker">Account verification</p>
      <h1 id="verifyTitle">Verifying your account</h1>
      <p id="verifyIntro" class="auth-intro">Please wait while we confirm your email address.</p>
      <div id="verifyMessage" class="auth-message" aria-live="polite"></div>

      <p class="auth-switch">
        <a href="admin.html">Go to Log In</a>
      </p>
    </section>
  </main>
</body>
</html>
