<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Klinik Putrijaya services, treatment information, prices and galleries.">
  <title>Services | Klinik Putrijaya</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/services.css">
  <script src="js/main.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/services.js" defer></script>
</head>
<body>
  <div id="siteHeader"></div>

  <main>
    <section class="page-hero services-hero">
      <div class="wrap">
        <div class="eyebrow">Care for every stage</div>
        <h1>Our Services</h1>
        <p>Browse service information, preparation guidance, available packages and clinic galleries.</p>
      </div>
    </section>

    <section class="services-section">
      <div class="wrap">
        <div class="services-toolbar">
          <div>
            <span class="eyebrow">Explore care</span>
            <h2>Find the right service</h2>
          </div>

          <div class="services-controls">
            <label class="sr-only" for="serviceSearch">Search services</label>
            <input id="serviceSearch" type="search" placeholder="Search service…" autocomplete="off">

            <label class="sr-only" for="serviceCategory">Filter by category</label>
            <select id="serviceCategory">
              <option value="">All categories</option>
            </select>
          </div>
        </div>

        <div id="servicesGrid" class="services-grid" aria-live="polite">
          <div class="services-empty">Loading services…</div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
</body>
</html>
