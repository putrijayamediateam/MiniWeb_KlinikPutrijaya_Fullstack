<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Reset Password | Klinik Putrijaya Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/admin-auth.css?v=20261118-1">
  <script src="js/api.js" defer></script>
  <script src="js/reset-password.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <img src="images/cheras-front-6.webp" alt="" class="auth-hero-photo" width="1200" height="900">
      <a class="auth-hero-brand" href="index.html" aria-label="Klinik Putrijaya website">
        <img src="images/logoklinik.png" alt="Klinik Putrijaya">
      </a>
      <div class="auth-hero-copy">
        <p class="auth-hero-title">Staff portal</p>
        <p>Bookings, services, promotions and community updates for Cheras, Sungai Besi and Puchong.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-inner">
        <a class="auth-brand" href="index.html">
          <img src="images/logoklinik.png" alt="Klinik Putrijaya">
        </a>
        <p class="auth-kicker">Admin security</p>
        <h1>Create a new password</h1>
        <p class="auth-intro">Use at least 10 characters and keep the password private.</p>

        <form id="resetPasswordForm">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" minlength="10" autocomplete="new-password" required>

          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required>

          <button id="resetPasswordBtn" type="submit">Change password</button>
          <div id="resetPasswordMessage" class="auth-message" aria-live="polite"></div>
        </form>

        <a class="auth-back" href="admin.html">← Back to admin login</a>
      </div>
    </section>
  </main>
</body>
</html>
