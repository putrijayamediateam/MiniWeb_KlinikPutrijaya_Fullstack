<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Klinik Putrijaya Admin</title>
  <link rel="stylesheet" href="css/admin-auth.css">
  <script src="js/api.js" defer></script>
  <script src="js/reset-password.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">
        <img src="images/logoklinik.png" alt="Klinik Putrijaya">
      </a>
      <p class="auth-kicker">Admin security</p>
      <h1>Create a new password</h1>
      <p class="auth-intro">Use at least 10 characters and keep the password private.</p>

      <form id="resetPasswordForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" minlength="10" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required>

        <button id="resetPasswordBtn" type="submit">Change password</button>
        <div id="resetPasswordMessage" class="auth-message" aria-live="polite"></div>
      </form>

      <a class="auth-back" href="admin.html">← Back to admin login</a>
    </section>
  </main>
</body>
</html>
